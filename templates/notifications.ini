[match-found]
title = mc-wall
body = Matched {lane_tag} — the goal is on the clipboard. Paste it in the SAME session.

[goal-re-copied]
title = mc-wall
body = That was the prompt again — the goal is on the clipboard now.

[canary-nudge]
title = mc-wall
body = {lane_tag}: no /goal seen in ZCode 60s after the match — paste the goal in the same session.

[still-no-session]
title = mc-wall
body = {lane_tag}: still no new session after 120s — use re-copy on the Wall if needed.

[ambiguous]
title = mc-wall
body = {lane_tag}: multiple matching sessions — nothing was copied. Use re-copy to re-check.

[conflict]
title = mc-wall
body = {lane_tag}: the prompt landed in a session for a different repo — this launch was flagged.
